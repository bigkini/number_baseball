<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
        <title>Number Baseball</title>
        <style>
            :root {
                --bg: #f8fafc;
                --ink: #0f172a;
                --muted: #64748b;
                --line: #e2e8f0;
                --board: #475569;
                --blue: #3b82f6;
                --orange: #f59e0b;
                --teal: #4ea3ac;
                --green: #10b981;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 26px 14px;
                background: var(--bg);
                color: var(--ink);
                font-family:
                    Pretendard,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
            }
            .app {
                width: min(100%, 500px);
                margin: auto;
            }
            header {
                text-align: center;
                margin-bottom: 16px;
            }
            h1 {
                margin: 4px;
                font-size: 1.7rem;
            }
            .status {
                color: var(--blue);
                font-weight: 700;
            }
            .top {
                display: flex;
                justify-content: center;
                gap: 8px;
                margin-bottom: 16px;
            }
            button {
                border: 1px solid var(--line);
                border-radius: 8px;
                background: #fff;
                color: var(--ink);
                font: 700 14px inherit;
                cursor: pointer;
                touch-action: manipulation;
            }
            .top button {
                padding: 10px 18px;
            }
            .reset {
                border: 0 !important;
                background: var(--blue) !important;
                color: #fff !important;
            }
            .card {
                position: relative;
                padding: 18px;
                border-radius: 12px;
                background: var(--board);
                box-shadow: 0 10px 25px #0f172a20;
            }
            .score {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 5px;
                margin-bottom: 14px;
            }
            .score div {
                padding: 10px;
                border-radius: 7px;
                background: #ffffff14;
                color: #fff;
                text-align: center;
            }
            .score strong {
                display: block;
            }
            .score span {
                color: #cbd5e1;
                font-size: 0.7rem;
            }
            .digits {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 6px;
            }
            .digit {
                display: grid;
                place-items: center;
                aspect-ratio: 1;
                border-radius: 7px;
                background: #fff;
                color: #cbd5e1;
                font-size: clamp(1.8rem, 10vw, 2.5rem);
                font-weight: 800;
            }
            .digit.filled {
                color: #1e293b;
            }
            .help {
                min-height: 18px;
                margin: 11px 0;
                color: #cbd5e1;
                text-align: center;
                font-size: 0.75rem;
            }
            .help.error {
                color: #fecaca;
                font-weight: 700;
            }
            .keypad {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 6px;
            }
            .key {
                min-height: 44px;
                font: 800 1rem monospace;
            }
            .key:active {
                background: #dbeafe;
                transform: scale(0.97);
            }
            .actions {
                display: grid;
                grid-template-columns: 1fr 2fr;
                gap: 7px;
                margin-top: 7px;
            }
            .actions button {
                min-height: 44px;
            }
            .submit {
                border: 0;
                background: var(--orange);
                color: #fff;
            }
            .panel {
                margin-top: 18px;
                padding: 15px;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: #fff;
            }
            .panel-head {
                display: flex;
                justify-content: space-between;
                gap: 10px;
                margin-bottom: 12px;
            }
            .panel h2 {
                margin: 0;
                font-size: 0.9rem;
            }
            .note {
                margin: 3px 0 0;
                color: var(--muted);
                font-size: 0.7rem;
            }
            .legend {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                justify-content: flex-end;
                color: var(--muted);
                font-size: 0.62rem;
            }
            .legend span {
                display: flex;
                align-items: center;
                gap: 3px;
            }
            .dot {
                width: 8px;
                height: 8px;
                border-radius: 2px;
            }
            .no {
                background: #e2e8f0;
                color: #94a3b8;
            }
            .maybe {
                background: #aaf1ed;
                color: #155e75;
            }
            .yes {
                background: var(--green) !important;
                color: #fff !important;
            }
            .matrix {
                display: grid;
                grid-template-columns: 36px repeat(4, 1fr);
                gap: 4px;
                align-items: center;
            }
            .pos,
            .num {
                text-align: center;
                font-size: 0.7rem;
                font-weight: 800;
            }
            .pos {
                color: var(--muted);
            }
            .num {
                color: #475569;
                font-family: monospace;
            }
            .poss {
                display: grid;
                place-items: center;
                min-height: 31px;
                border-radius: 5px;
                font: 700 0.78rem monospace;
            }
            .candidates {
                margin-top: 12px;
                padding: 12px;
                border-radius: 8px;
                background: #fef3c7;
                color: #92400e;
                font-size: 0.75rem;
            }
            .candidate-head {
                display: flex;
                justify-content: space-between;
                font-weight: 800;
            }
            .candidate-list {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
                margin-top: 8px;
            }
            .candidate-list span {
                padding: 5px 7px;
                border-radius: 4px;
                background: #fff;
                font: 700 0.78rem monospace;
            }
            .history {
                margin-top: 18px;
            }
            .history-head {
                display: flex;
                justify-content: space-between;
                margin-bottom: 7px;
            }
            .history-head h2 {
                margin: 0;
                font-size: 0.9rem;
            }
            .history-head span {
                color: var(--muted);
                font-size: 0.72rem;
            }
            .empty {
                padding: 20px;
                border: 1px dashed #cbd5e1;
                border-radius: 8px;
                color: #94a3b8;
                text-align: center;
                font-size: 0.8rem;
            }
            .item {
                display: grid;
                grid-template-columns: 28px 1fr auto;
                align-items: center;
                padding: 10px 12px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: #fff;
                margin-top: 6px;
            }
            .turn {
                color: #94a3b8;
                font: 0.7rem monospace;
            }
            .guess {
                font: 800 1rem monospace;
                letter-spacing: 0.15em;
            }
            .result {
                display: flex;
                gap: 4px;
                font: 800 0.72rem monospace;
            }
            .s,
            .b {
                padding: 5px 6px;
                border-radius: 4px;
                color: #fff;
            }
            .s {
                background: var(--orange);
            }
            .b {
                background: var(--teal);
            }
            .overlay {
                position: absolute;
                inset: 0;
                z-index: 5;
                display: none;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                border-radius: 12px;
                background: #fffffff2;
                backdrop-filter: blur(5px);
            }
            .overlay.show {
                display: flex;
            }
            .win {
                color: var(--green);
                font-size: 1.5rem;
                font-weight: 800;
            }
            .answer {
                margin: 8px;
                font: 800 2rem monospace;
                letter-spacing: 0.15em;
            }
            .detail {
                margin: 0 0 18px;
                color: var(--muted);
                font-size: 0.8rem;
            }
            .replay {
                padding: 11px 20px;
                border: 0;
                background: var(--green);
                color: #fff;
            }
            .rules {
                text-align: center;
                color: var(--muted);
                font-size: 0.72rem;
                line-height: 1.7;
            }
            [hidden] {
                display: none !important;
            }
            @media (min-width: 700px) {
                .keypad {
                    display: none;
                }
                .actions {
                    margin-top: 0;
                }
                .help {
                    margin-bottom: 13px;
                }
            }
            @media (max-width: 390px) {
                body {
                    padding: 20px 8px;
                }
                .card,
                .panel {
                    padding: 12px;
                }
                .matrix {
                    grid-template-columns: 30px repeat(4, 1fr);
                }
            }
        </style>
    </head>
    <body>
        <main class="app">
            <header>
                <h1>Number Baseball</h1>
                <div class="status">4 Digits · 0–9</div>
            </header>
            <div class="top"><button class="reset">새 게임</button><button id="rules-btn">게임 규칙</button></div>
            <section class="card">
                <div class="score">
                    <div><strong id="attempts">0</strong><span>시도</span></div>
                    <div><strong id="count">5,040</strong><span>남은 후보</span></div>
                </div>
                <div class="digits" id="digits">
                    <div class="digit">·</div>
                    <div class="digit">·</div>
                    <div class="digit">·</div>
                    <div class="digit">·</div>
                </div>
                <p class="help" id="help">키보드 또는 아래 숫자판으로 입력하세요</p>
                <div class="keypad" id="keypad"></div>
                <div class="actions">
                    <button id="back">지우기</button><button class="submit" id="submit">확인</button>
                </div>
                <aside class="candidates" id="candidates" hidden>
                    <div class="candidate-head"><span>가능한 숫자</span><strong id="short-count"></strong></div>
                    <div class="candidate-list" id="candidate-list"></div>
                </aside>
                <div class="overlay" id="overlay">
                    <div class="win">⚾ Home Run!</div>
                    <div class="answer" id="answer"></div>
                    <p class="detail" id="detail"></p>
                    <button class="replay">다시 하기</button>
                </div>
            </section>
            <section class="panel">
                <div class="panel-head">
                    <div>
                        <h2>자리별 가능성</h2>
                        <p class="note">남은 후보를 기준으로 계산합니다.</p>
                    </div>
                    <div class="legend">
                        <span><i class="dot no"></i>불가능</span><span><i class="dot maybe"></i>가능</span
                        ><span><i class="dot yes"></i>확정</span>
                    </div>
                </div>
                <div class="matrix" id="matrix"></div>
            </section>
            <section class="history">
                <div class="history-head">
                    <h2>History</h2>
                    <span id="history-status">아직 기록이 없어요</span>
                </div>
                <div class="empty" id="empty">첫 번째 숫자를 입력해 보세요.</div>
                <div id="history-list"></div>
            </section>
            <p class="rules" id="rules" hidden>
                숫자와 위치가 같으면 스트라이크, 숫자만 같으면 볼입니다.<br />중복 숫자는 없으며 첫 자리에는 0도 올 수
                있어요.
            </p>
        </main>
        <script>
            const ALL = [];
            for (let n = 0; n < 1e4; n++) {
                const v = String(n).padStart(4, "0");
                if (new Set(v).size === 4) ALL.push(v);
            }
            const $ = (id) => document.getElementById(id),
                digitEls = [...document.querySelectorAll(".digit")];
            let secret, input, history, candidates, solved;
            function score(a, g) {
                let s = 0,
                    b = 0;
                for (let i = 0; i < 4; i++) {
                    if (a[i] === g[i]) s++;
                    else if (a.includes(g[i])) b++;
                }
                return { strikes: s, balls: b };
            }
            function msg(t = "키보드 또는 아래 숫자판으로 입력하세요", e = false) {
                $("help").textContent = t;
                $("help").className = "help" + (e ? " error" : "");
            }
            function drawInput() {
                digitEls.forEach((el, i) => {
                    el.textContent = input[i] || "·";
                    el.classList.toggle("filled", !!input[i]);
                });
                $("back").disabled = !input;
            }
            function drawMatrix() {
                const labels = ["1번째", "2번째", "3번째", "4번째"];
                let h = "<span></span>" + labels.map((x) => `<span class="pos">${x}</span>`).join("");
                for (let d = 0; d < 10; d++) {
                    h += `<span class="num">${d}</span>`;
                    for (let p = 0; p < 4; p++) {
                        const hits = candidates.filter((v) => +v[p] === d).length,
                            state = hits === 0 ? "no" : hits === candidates.length ? "yes" : "maybe",
                            pct = Math.round((hits / candidates.length) * 100);
                        h += `<span class="poss ${state}" title="${labels[p]} 숫자 ${d}: ${pct}%">${d}</span>`;
                    }
                }
                $("matrix").innerHTML = h;
            }
            function draw() {
                $("attempts").textContent = history.length;
                $("count").textContent = candidates.length.toLocaleString();
                $("history-status").textContent = history.length ? `총 ${history.length}번 시도` : "아직 기록이 없어요";
                $("empty").hidden = !!history.length;
                $("history-list").innerHTML = history
                    .map(
                        (x, i) =>
                            `<div class="item"><span class="turn">${history.length - i}</span><strong class="guess">${x.guess}</strong><div class="result"><span class="s">${x.strikes}S</span><span class="b">${x.balls}B</span></div></div>`
                    )
                    .join("");
                const show = !solved && history.length && candidates.length <= 20;
                $("candidates").hidden = !show;
                if (show) {
                    $("short-count").textContent = candidates.length;
                    $("candidate-list").innerHTML = candidates.map((v) => `<span>${v}</span>`).join("");
                }
                drawMatrix();
            }
            function type(v) {
                if (solved || input.length === 4 || input.includes(v)) return;
                input += v;
                msg();
                drawInput();
            }
            function submit() {
                if (solved) return;
                if (input.length !== 4) return msg("중복 없이 숫자 4개를 입력해 주세요.", true);
                const r = { guess: input, ...score(secret, input) };
                history.unshift(r);
                candidates = candidates.filter((c) =>
                    history.every((x) => {
                        const q = score(c, x.guess);
                        return q.strikes === x.strikes && q.balls === x.balls;
                    })
                );
                solved = r.strikes === 4;
                input = "";
                drawInput();
                draw();
                if (solved) {
                    $("answer").textContent = secret;
                    $("detail").textContent = `${history.length}번 만에 맞혔어요. Enter를 누르면 새 게임이 시작됩니다.`;
                    $("overlay").classList.add("show");
                }
            }
            function reset() {
                secret = ALL[Math.floor(Math.random() * ALL.length)];
                input = "";
                history = [];
                candidates = [...ALL];
                solved = false;
                $("overlay").classList.remove("show");
                msg();
                drawInput();
                draw();
            }
            $("keypad").innerHTML = Array.from(
                { length: 10 },
                (_, n) => `<button class="key" data-digit="${n}" aria-label="숫자 ${n}">${n}</button>`
            ).join("");
            $("keypad").addEventListener("click", (e) => {
                const b = e.target.closest("[data-digit]");
                if (b) type(b.dataset.digit);
            });
            document.addEventListener("keydown", (e) => {
                if (/^\d$/.test(e.key)) {
                    e.preventDefault();
                    type(e.key);
                } else if (e.key === "Backspace") {
                    e.preventDefault();
                    input = input.slice(0, -1);
                    drawInput();
                } else if (e.key === "Enter") {
                    e.preventDefault();
                    solved ? reset() : submit();
                }
            });
            $("back").onclick = () => {
                input = input.slice(0, -1);
                drawInput();
            };
            $("submit").onclick = submit;
            document.querySelectorAll(".reset,.replay").forEach((b) => (b.onclick = reset));
            $("rules-btn").onclick = () => {
                $("rules").hidden = !$("rules").hidden;
            };
            reset();
        </script>
    </body>
</html>
